<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Bullet Journal Diário</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* (mantive o mesmo estilo, sem alterações) */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f3eb;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%23d1c9b7' fill-opacity='0.1' fill-rule='evenodd'/%3E%3C/svg%3E");
        }
        .btn-primary { background-color: #8a7e6b; color: white; }
        .btn-primary:hover { background-color: #5d4a35; }
        .btn-secondary { background-color: #7a9e7e; color: white; }
        .btn-secondary:hover { background-color: #5c7a5f; }
    </style>
</head>
<body>
    <div class="container mx-auto px-4 py-8 max-w-6xl text-center">
        <h1 class="text-4xl font-bold mb-4 text-[#5d4a35]">Meu Bullet Journal Diário</h1>
        <p id="current-date" class="text-lg italic text-[#8a7e6b] mb-6"></p>

        <div class="max-w-xl mx-auto mb-8">
            <p id="progress-message" class="text-gray-700 mb-2">Comece seu dia marcando suas tarefas!</p>
            <div class="w-full bg-[#e6dfd0] rounded-full h-3 overflow-hidden">
                <div id="progress-bar-fill" class="h-3 bg-gradient-to-r from-[#8a7e6b] to-[#a39a8b]" style="width: 0%"></div>
            </div>
            <p id="progress-percentage" class="text-md text-gray-600 mt-1 text-right">0%</p>
        </div>

       <!-- Seções principais -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 main-container">

    <!-- Cuidados Pessoais -->
    <section class="section-card rounded-xl p-6 section-border-personal relative">
      <div class="washi-tape"></div>
      <h2 class="text-2xl font-bold header-decoration mb-8">Cuidados Pessoais</h2>
      <div class="space-y-2">

        <div class="checkbox-container">
          <input type="checkbox" id="teeth" class="task-checkbox">
          <label for="teeth">
            <div class="custom-checkbox"></div>
            <span class="task-text">Escovar os dentes</span>
          </label>
        </div>

        <div class="checkbox-container">
          <input type="checkbox" id="morning-meds" class="task-checkbox">
          <label for="morning-meds">
            <div class="custom-checkbox"></div>
            <span class="task-text">Tomar remédios da manhã</span>
          </label>
        </div>

        <div class="checkbox-container">
          <input type="checkbox" id="shower" class="task-checkbox">
          <label for="shower">
            <div class="custom-checkbox"></div>
            <span class="task-text">Tomar banho</span>
          </label>
        </div>

        <div class="checkbox-container">
          <input type="checkbox" id="exercise" class="task-checkbox">
          <label for="exercise">
            <div class="custom-checkbox"></div>
            <span class="task-text">Fazer exercício</span>
          </label>
        </div>

        <div class="checkbox-container">
          <input type="checkbox" id="night-meds" class="task-checkbox">
          <label for="night-meds">
            <div class="custom-checkbox"></div>
            <span class="task-text">Tomar remédios da noite</span>
          </label>
        </div>
      </div>
    </section>

    <!-- Tarefas Diárias -->
    <section class="section-card rounded-xl p-6 section-border-daily relative">
      <div class="paper-clip"></div>
      <h2 class="text-2xl font-bold header-decoration mb-8">Tarefas Diárias</h2>

      <div class="space-y-2 max-h-[500px] overflow-y-auto pr-2">
        <template id="daily-tasks-template">
          <div class="checkbox-container">
            <input type="checkbox" class="task-checkbox">
            <label>
              <div class="custom-checkbox"></div>
              <span class="task-text"></span>
            </label>
          </div>
        </template>

        <!-- Lista fixa -->
        <div class="checkbox-container"><input type="checkbox" id="coffee" class="task-checkbox"><label for="coffee"><div class="custom-checkbox"></div><span class="task-text">Fazer café</span></label></div>
        <div class="checkbox-container"><input type="checkbox" id="bed" class="task-checkbox"><label for="bed"><div class="custom-checkbox"></div><span class="task-text">Arrumar a cama</span></label></div>
        <div class="checkbox-container"><input type="checkbox" id="sweep" class="task-checkbox"><label for="sweep"><div class="custom-checkbox"></div><span class="task-text">Varrer a casa</span></label></div>
        <div class="checkbox-container"><input type="checkbox" id="laundry" class="task-checkbox"><label for="laundry"><div class="custom-checkbox"></div><span class="task-text">Lavar roupa</span></label></div>
        <div class="checkbox-container"><input type="checkbox" id="meals" class="task-checkbox"><label for="meals"><div class="custom-checkbox"></div><span class="task-text">Preparar almoço e janta</span></label></div>
        <div class="checkbox-container"><input type="checkbox" id="trash" class="task-checkbox"><label for="trash"><div class="custom-checkbox"></div><span class="task-text">Tirar o lixo</span></label></div>
        <div class="checkbox-container"><input type="checkbox" id="bedding" class="task-checkbox"><label for="bedding"><div class="custom-checkbox"></div><span class="task-text">Trocar roupa de cama e banho</span></label></div>
        <div class="checkbox-container"><input type="checkbox" id="bathroom" class="task-checkbox"><label for="bathroom"><div class="custom-checkbox"></div><span class="task-text">Limpar banheiro</span></label></div>
        <div class="checkbox-container"><input type="checkbox" id="litterbox" class="task-checkbox"><label for="litterbox"><div class="custom-checkbox"></div><span class="task-text">Limpar caixa de areia</span></label></div>
        <div class="checkbox-container"><input type="checkbox" id="cat-food" class="task-checkbox"><label for="cat-food"><div class="custom-checkbox"></div><span class="task-text">Ração, petisco e sachê</span></label></div>
      </div>
    </section>

    <!-- Outros -->
    <section class="section-card rounded-xl p-6 section-border-other relative">
      <div class="washi-tape" style="left:auto;right:20px;background:linear-gradient(45deg,#c17a74 25%,#e6dfd0 25%,#e6dfd0 50%,#c17a74 50%,#c17a74 75%,#e6dfd0 75%);"></div>
      <h2 class="text-2xl font-bold header-decoration mb-8">Outros</h2>

      <div class="space-y-6">
        <div class="rating-group">
          <p class="font-medium text-gray-700 mb-2">Alimentação balanceada</p>
          <div class="star-rating" id="food-rating">
            <input type="radio" id="food-5" name="food-rating" value="5"><label for="food-5" class="green-zone"></label>
            <input type="radio" id="food-4" name="food-rating" value="4"><label for="food-4" class="green-zone"></label>
            <input type="radio" id="food-3" name="food-rating" value="3"><label for="food-3" class="yellow-zone"></label>
            <input type="radio" id="food-2" name="food-rating" value="2"><label for="food-2" class="red-zone"></label>
            <input type="radio" id="food-1" name="food-rating" value="1"><label for="food-1" class="red-zone"></label>
          </div>
        </div>

        <div class="rating-group">
          <p class="font-medium text-gray-700 mb-2">Sono</p>
          <div class="star-rating" id="sleep-rating">
            <input type="radio" id="sleep-5" name="sleep-rating" value="5"><label for="sleep-5" class="green-zone"></label>
            <input type="radio" id="sleep-4" name="sleep-rating" value="4"><label for="sleep-4" class="green-zone"></label>
            <input type="radio" id="sleep-3" name="sleep-rating" value="3"><label for="sleep-3" class="yellow-zone"></label>
            <input type="radio" id="sleep-2" name="sleep-rating" value="2"><label for="sleep-2" class="red-zone"></label>
            <input type="radio" id="sleep-1" name="sleep-rating" value="1"><label for="sleep-1" class="red-zone"></label>
          </div>
        </div>

        <div class="rating-group">
          <p class="font-medium text-gray-700 mb-2">Água</p>
          <div class="star-rating" id="water-rating">
            <input type="radio" id="water-5" name="water-rating" value="5"><label for="water-5" class="green-zone"></label>
            <input type="radio" id="water-4" name="water-rating" value="4"><label for="water-4" class="green-zone"></label>
            <input type="radio" id="water-3" name="water-rating" value="3"><label for="water-3" class="yellow-zone"></label>
            <input type="radio" id="water-2" name="water-rating" value="2"><label for="water-2" class="red-zone"></label>
            <input type="radio" id="water-1" name="water-rating" value="1"><label for="water-1" class="red-zone"></label>
          </div>
        </div>

        <div class="rating-group">
          <p class="font-medium text-gray-700 mb-2">Humor</p>
          <div class="star-rating" id="mood-rating">
            <input type="radio" id="mood-5" name="mood-rating" value="5"><label for="mood-5" class="green-zone"></label>
            <input type="radio" id="mood-4" name="mood-rating" value="4"><label for="mood-4" class="green-zone"></label>
            <input type="radio" id="mood-3" name="mood-rating" value="3"><label for="mood-3" class="yellow-zone"></label>
            <input type="radio" id="mood-2" name="mood-rating" value="2"><label for="mood-2" class="red-zone"></label>
            <input type="radio" id="mood-1" name="mood-rating" value="1"><label for="mood-1" class="red-zone"></label>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>

        <!-- Botões -->
        <button id="reset-button" class="btn-primary py-3 px-6 rounded-lg font-bold mx-2 shadow-md transition">Reiniciar</button>
        <button id="save-button" class="btn-secondary py-3 px-6 rounded-lg font-bold mx-2 shadow-md transition">Salvar</button>
    </div>

    <script>
        // Atualiza data
        document.getElementById('current-date').textContent = 
            new Date().toLocaleDateString('pt-BR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        // Atualiza barra de progresso
        function updateProgress() {
            const boxes = document.querySelectorAll('.task-checkbox');
            const total = boxes.length;
            const done = [...boxes].filter(b => b.checked).length;
            const percent = total ? Math.round((done / total) * 100) : 0;

            document.getElementById('progress-bar-fill').style.width = percent + '%';
            document.getElementById('progress-percentage').textContent = percent + '%';
            document.getElementById('progress-message').textContent =
                percent === 100 ? 'Parabéns! Todas as tarefas concluídas 🎉' :
                `Você completou ${percent}% das tarefas.`;
        }

        // Salvar e carregar progresso localmente
        function saveState() {
            const state = [...document.querySelectorAll('.task-checkbox')].map(c => c.checked);
            localStorage.setItem('journalState', JSON.stringify(state));
            alert('Progresso salvo!');
        }

        function loadState() {
            const saved = JSON.parse(localStorage.getItem('journalState') || '[]');
            document.querySelectorAll('.task-checkbox').forEach((c, i) => c.checked = saved[i]);
            updateProgress();
        }

        function resetAll() {
            if (confirm('Deseja reiniciar as tarefas?')) {
                document.querySelectorAll('.task-checkbox').forEach(c => c.checked = false);
                localStorage.removeItem('journalState');
                updateProgress();
            }
        }

        document.getElementById('save-button').addEventListener('click', saveState);
        document.getElementById('reset-button').addEventListener('click', resetAll);
        document.querySelectorAll('.task-checkbox').forEach(c => c.addEventListener('change', updateProgress));

        loadState();
    </script>
</body>
</html>
